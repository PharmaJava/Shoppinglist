name: Mantener despierto Supabase

# El plan gratuito de Supabase pausa un proyecto que pasa una semana sin
# recibir una sola petición. Reactivarlo es manual y, mientras tanto, la web
# no funciona para nadie. Una consulta cada dos días evita llegar a eso.
#
# Configuración: en Settings → Secrets and variables → Actions hacen falta
#   SUPABASE_URL          https://xxxxxxxx.supabase.co
#   SUPABASE_ANON_KEY     la clave publicable (la misma que usa el navegador)
#
# Son los mismos valores que NEXT_PUBLIC_SUPABASE_URL y
# NEXT_PUBLIC_SUPABASE_ANON_KEY en Vercel. Mientras falten, esta tarea falla a
# propósito cada dos días: dar por bueno un proyecto que se va a pausar sería
# peor que el correo.
#
# Ojo: GitHub desactiva las tareas programadas de un repositorio sin actividad
# durante 60 días, y avisa por correo antes de hacerlo. Si el proyecto entra en
# reposo, basta con volver a activarla desde la pestaña Actions.

on:
  schedule:
    # A las 6:12 UTC los días impares del mes. El minuto no es redondo a
    # propósito: GitHub retrasa las tareas que caen en horas en punto porque
    # es cuando todo el mundo las programa.
    - cron: "12 6 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar el catálogo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          # `::error::` y no un `echo`: lo que sale por ahí es lo que GitHub
          # manda en el correo y enseña como anotación del run. Con un `echo`
          # el aviso llegaba diciendo «Process completed with exit code 1», que
          # no dice qué hay que hacer y obliga a abrir el log para enterarse.
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error title=Faltan los secretos del repositorio::Añade SUPABASE_URL y SUPABASE_ANON_KEY en Settings → Secrets and variables → Actions. Los valores son los mismos que NEXT_PUBLIC_SUPABASE_URL y NEXT_PUBLIC_SUPABASE_ANON_KEY en Vercel. Sin ellos esta tarea no puede hacer nada y el proyecto de Supabase se pausará a la semana."
            exit 1
          fi

          # `categories` es catálogo de sistema con lectura pública (política
          # categories_select_all): no expone ningún dato de nadie y sirve
          # igual para que el proyecto cuente como activo.
          code=$(curl --silent --show-error --output /tmp/respuesta.json --write-out '%{http_code}' \
            --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/categories?select=id&limit=1")

          echo "HTTP ${code}"
          cat /tmp/respuesta.json
          echo

          # El identificador del proyecto sale de la URL. No es un secreto —va
          # en el paquete que descarga cualquier navegador, dentro de
          # NEXT_PUBLIC_SUPABASE_URL— y es justo lo que hace falta ver para
          # saber de un vistazo si el secreto apunta al proyecto que toca.
          proyecto=$(printf '%s' "${SUPABASE_URL}" | sed -E 's#^https?://([^./]+).*#\1#')

          if [ "${code}" = "200" ]; then
            echo "::notice title=Supabase sigue despierto::El proyecto ${proyecto} respondió 200. Siguiente comprobación en dos días."
            exit 0
          fi

          # Cada fallo tiene un arreglo distinto, y decir «no ha devuelto 200»
          # obliga a abrir el log y a adivinar cuál de los tres es.
          if [ "${code}" = "401" ] || [ "${code}" = "403" ]; then
            echo "::error title=La clave anónima ya no vale::El proyecto ${proyecto} ha rechazado la clave (${code}). Copia la publicable de Supabase (Project Settings → API) al secreto SUPABASE_ANON_KEY."
            exit 1
          fi

          if grep -q "PGRST205" /tmp/respuesta.json; then
            echo "::error title=Ese proyecto no tiene las tablas de la app::El proyecto ${proyecto} ha respondido, pero su API no encuentra 'public.categories'. Casi siempre significa que SUPABASE_URL y SUPABASE_ANON_KEY son de OTRO proyecto de Supabase: compara ${proyecto} con el identificador de NEXT_PUBLIC_SUPABASE_URL en Vercel y, si no coinciden, corrige los dos secretos. Si sí coinciden, es que faltan migraciones por aplicar (pnpm db:check) o que la caché de esquema de PostgREST se quedó atrás: Project Settings → API → Restart server. Ojo: mientras el secreto apunte a otro sitio, el proyecto de verdad se sigue durmiendo."
            exit 1
          fi

          echo "::error title=Supabase no respondió 200::El proyecto ${proyecto} ha devuelto ${code}. O ya está pausado —hay que reactivarlo a mano desde el panel de Supabase— o su API está caída."
          exit 1
